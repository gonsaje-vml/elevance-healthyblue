name: Refresh search asset index

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/refresh-asset-index.yaml
      - asset-index.config.json
      - package.json
      - package-lock.json
      - blocks/search/search.js
      - tools/build-da-source-index.mjs
      - tools/build-da-source-index.test.mjs
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      roots:
        description: 'Optional comma-separated directory override, such as /docs,/media'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: refresh-search-asset-index-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test asset index generator
        run: npm run test:search-index

      - name: Read configured output paths
        id: config
        run: |
          node -e '
            const fs = require("node:fs");
            const { outputs } = JSON.parse(fs.readFileSync("asset-index.config.json", "utf8"));
            const paths = Object.values(outputs || {});
            const invalid = paths.length !== 2 || paths.some((output) => (
              typeof output !== "string"
              || output.startsWith("/")
              || output.split("/").includes("..")
              || !/^[A-Za-z0-9._/-]+$/.test(output)
            ));
            if (invalid) throw new Error("Configure two safe repository-relative output paths.");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `paths=${paths.join(" ")}\n`);
          '

      - name: Create short-lived Adobe IMS token
        env:
          ADOBE_CLIENT_ID: ${{ secrets.ADOBE_CLIENT_ID }}
          ADOBE_CLIENT_SECRET: ${{ secrets.ADOBE_CLIENT_SECRET }}
          ADOBE_SCOPES: ${{ secrets.ADOBE_SCOPES }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';

          const required = ['ADOBE_CLIENT_ID', 'ADOBE_CLIENT_SECRET', 'ADOBE_SCOPES'];
          const missing = required.filter((name) => !process.env[name]?.trim());
          if (missing.length) {
            throw new Error(`Missing required GitHub Actions secrets: ${missing.join(', ')}`);
          }

          const scopes = process.env.ADOBE_SCOPES
            .replaceAll('\\_', '_')
            .split(',')
            .map((scope) => scope.trim())
            .filter(Boolean)
            .join(',');
          const body = new URLSearchParams({
            grant_type: 'client_credentials',
            client_id: process.env.ADOBE_CLIENT_ID,
            client_secret: process.env.ADOBE_CLIENT_SECRET,
            scope: scopes,
          });
          const response = await fetch('https://ims-na1.adobelogin.com/ims/token/v3', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body,
            signal: AbortSignal.timeout(30000),
          });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok || !payload.access_token) {
            const detail = payload.error_description || payload.error || 'No access token returned.';
            throw new Error(`Adobe IMS token request failed with HTTP ${response.status}: ${detail}`);
          }

          process.stdout.write(`::add-mask::${payload.access_token}\n`);
          appendFileSync(process.env.GITHUB_ENV, `DA_IMS_TOKEN=${payload.access_token}\n`);
          process.stdout.write(`Created an Adobe IMS token valid for ${payload.expires_in || 'an unknown number of'} seconds.\n`);
          NODE

      - name: Verify DA read access
        run: |
          node --input-type=module <<'NODE'
          const url = 'https://admin.da.live/list/gonsaje-vml/elevance-healthyblue/docs';
          const response = await fetch(url, {
            headers: {
              Accept: 'application/json',
              Authorization: `Bearer ${process.env.DA_IMS_TOKEN}`,
            },
            signal: AbortSignal.timeout(30000),
          });
          if (!response.ok) {
            process.stderr.write(
              `::error title=DA access check failed::Technical account received HTTP ${response.status} from ${url}.\n`,
            );
            process.exit(1);
          }
          const items = await response.json();
          if (!Array.isArray(items)) throw new Error('DA List API did not return an array.');
          process.stdout.write(`DA access verified; found ${items.length} direct entries under /docs.\n`);
          NODE

      - name: Build preview and live asset indexes
        env:
          ASSET_INDEX_ROOTS: ${{ inputs.roots }}
        run: npm run search:index:da

      - name: Detect index changes
        id: changes
        env:
          ASSET_INDEX_OUTPUTS: ${{ steps.config.outputs.paths }}
        run: |
          read -ra output_paths <<< "$ASSET_INDEX_OUTPUTS"
          if [ -n "$(git status --porcelain -- "${output_paths[@]}")" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "$ASSET_INDEX_OUTPUTS are already current."
          fi

      - name: Commit updated index
        if: steps.changes.outputs.changed == 'true'
        env:
          ASSET_INDEX_OUTPUTS: ${{ steps.config.outputs.paths }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          read -ra output_paths <<< "$ASSET_INDEX_OUTPUTS"
          git add -- "${output_paths[@]}"
          git commit -m "chore(search): refresh asset indexes"
          git push origin "HEAD:main"
